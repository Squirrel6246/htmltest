<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="images/favicon.png">
        <title>
            HTML Test
        </title>
    </head>

    <body>
        <header>
            <h1>HTML Examples</h1>
        </header>
        
        <!--Headers-->
        <hr>
        <h4><b>Header Tests:</b></h4>
        <h1 class="header">h1 Test</h1>
        <h2 class="header">h2 Test</h2>
        <h3 class="header">h3 Test</h3>
        <h4 class="header">h4 Test</h4>
        <h5 class="header">h5 Test</h5>
        <h6 class="header">h6 Test</h6>
        <hr>

        <!--Links-->
        <h4><b>Link Test:</b></h4>
        <a 
        target="_blank" 
        href="https://www.google.com/"
        title="Google.com">

            Google
        </a>
        <br>
        <a
        target="_blank"
        href="https://duckduckgo.com/"
        title="DuckDuckGo.com">
            DuckDuckGo
        </a>
        <br>
        <a
        target="_blank"
        href="https://www.youtube.com/"
        title="Youtube.com">
            Youtube
        </a>
        <hr>
        <!--Buttons-->
        <h4><b>Button Test:</b></h4>
        <a href="https://google.com" target="_blank" title="Google.com">
        <button style="background-color: lightskyblue; font-size: 15px; border-radius: 4px; border-width: 2px; border-color: black;">Google</button>
        </a>
        <br><br>
        <a href="https://DuckDuckGo.com" target="_blank" title="Google.com">
        <button style="background-color: orange; font-size: 15px; border-radius: 4px; border-width: 2px; border-color: black;">
            DuckDuckGo
        </button>
        </a>
        <br><br>
        <a href="https://youtube.com" target="_blank" title="Google.com">
        <button style="background-color: lightcoral; font-size: 15px; border-radius: 4px; border-width: 2px; border-color: black;">Youtube</button>
        </a>
    </body>
</html>
